services:
  pflegerust:
    # All-in-One Container: enthält PflegeRust Web-App, Backend-API UND MariaDB 10.11!
    # Einfach starten mit: docker compose up -d
    image: ${PFLEGERUST_IMAGE:-pflegerust:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pflegerust
    restart: unless-stopped
    ports:
      - "${PFLEGERUST_PORT:-8080}:8080"
    volumes:
      - pflegerust_mysql:/var/lib/mysql
      - pflegerust_config:/var/lib/pflegerust

volumes:
  pflegerust_mysql:
  pflegerust_config:
